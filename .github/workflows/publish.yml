name: Publish to npm

# Publishes exactly once per v* tag, authenticated by npm Trusted Publishing
# (GitHub OIDC). No long-lived npm token is stored in this repository.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require an npm and Node that support trusted publishing
        run: |
          npm install --global "npm@^11.5.1"
          node_version="$(node --version | sed 's/^v//')"
          npm_version="$(npm --version)"
          echo "node $node_version, npm $npm_version"
          if [ "$(printf '%s\n22.14.0\n' "$node_version" | sort -V | head -n1)" != "22.14.0" ]; then
            echo "::error::Node $node_version is below 22.14.0"
            exit 1
          fi
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version is below 11.5.1"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip when this version already exists on npm
        id: exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$name@$VERSION is already published; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.exists.outputs.skip == 'false'
        run: npm publish --provenance
